<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Thống kê Y Tế</title>
    <th:block th:replace="base :: bt"></th:block>
    <style>
        .container {
            margin-top: 30px;
        }
        h2 {
            color: #0d6efd;
            border-bottom: 2px solid #0d6efd;
            padding-bottom: 10px;
            margin-top: 40px;
        }
        .table {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div th:replace="base :: menu"></div>
    <h1 class="text-center text-primary my-4">BÁO CÁO THỐNG KÊ Y TẾ</h1>

    <div class="my-4 card shadow-sm p-3">
        <h2 class="text-secondary border-bottom-0 pb-0 mb-3">Tùy chọn thống kê</h2>
        <form action="/stats" method="get" class="mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-auto">
                    <label for="year" class="col-form-label">Năm:</label>
                </div>
                <div class="col-auto">
                    <input type="number" id="year" name="year" class="form-control" th:value="${currentYear}">
                </div>
                <div class="col-auto">
                    <label for="time" class="col-form-label">Thời gian:</label>
                </div>
                <div class="col-auto">
                    <select id="time" name="time" class="form-select">
                        <option value="MONTH" th:selected="${currentTime == 'MONTH'}">Theo Tháng</option>
                        <option value="QUARTER" th:selected="${currentTime == 'QUARTER'}">Theo Quý</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Xem</button>
                </div>
            </div>
        </form>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">Doanh Thu Theo <span th:text="${currentTime == 'MONTH' ? 'Tháng' : 'Quý'}"></span> - Năm <span th:text="${currentYear}"></span></h5>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white">
                    <h5 class="card-title mb-0">Bệnh Nhân Theo Giới Tính</h5>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="genderChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-white">
                    <h5 class="card-title mb-0">Bệnh Nhân Theo Độ Tuổi</h5>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="ageGroupChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-info text-white">
                    <h5 class="card-title mb-0">Bệnh Nhân Theo Chuyên Khoa</h5>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="specialtyChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white">
                    <h5 class="card-title mb-0">Dịch Vụ & Thuốc Phổ Biến</h5>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="servicesUsedChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">
                    <h5 class="card-title mb-0">Bệnh Phổ Biến</h5>
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="popularDiseasesChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="base :: footer"></div>
<th:block id="scripts">
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.onload = function () {
            // Lấy dữ liệu từ Model (đã được controller truyền vào)
            const revenueByTime = /*[[${revenueByTime}]]*/ [];
            const patientsByGender = /*[[${patientsByGender}]]*/ [];
            const patientsByAgeGroup = /*[[${patientsByAgeGroup}]]*/ [];
            const patientsBySpecialty = /*[[${patientsBySpecialty}]]*/ [];
            const servicesUsed = /*[[${servicesUsed}]]*/ [];
            const popularDiseases = /*[[${popularDiseases}]]*/ [];

            // Hàm tạo màu ngẫu nhiên cho biểu đồ (để tránh trùng lặp màu)
            function generateColors(count) {
                const colors = [];
                for (let i = 0; i < count; i++) {
                    const hue = (i * 137) % 360; // Sử dụng Golden Angle để tạo màu phân tán
                    colors.push(`hsl(${hue}, 70%, 50%)`);
                }
                return colors;
            }

            // 1. Biểu đồ Doanh Thu Theo Thời Gian
            new Chart(document.getElementById('revenueChart'), {
                type: 'bar',
                data: {
                    labels: revenueByTime.map(row => row[0]),
                    datasets: [{
                            label: 'Doanh thu (VND)',
                            data: revenueByTime.map(row => row[1]),
                            backgroundColor: 'rgba(13, 110, 253, 0.7)', // Màu xanh primary
                            borderColor: 'rgba(13, 110, 253, 1)',
                            borderWidth: 1
                        }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                        },
                        title: {
                            display: false,
                            text: 'Doanh Thu Theo Thời Gian'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Doanh thu'
                            },
                            ticks: {
                                callback: function (value, index, values) {
                                    return value.toLocaleString('vi-VN') + ' VND';
                                }
                            }
                        }
                    }
                }
            });

            // 2. Biểu đồ Bệnh Nhân Theo Giới Tính
            const genderColors = ['#198754', '#6610f2']; // Màu xanh lá, tím
            new Chart(document.getElementById('genderChart'), {
                type: 'pie',
                data: {
                    labels: patientsByGender.map(row => row[0]),
                    datasets: [{
                            label: 'Số lượng bệnh nhân',
                            data: patientsByGender.map(row => row[1]),
                            backgroundColor: genderColors,
                            hoverOffset: 4
                        }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: false,
                            text: 'Bệnh Nhân Theo Giới Tính'
                        }
                    }
                }
            });

            // 3. Biểu đồ Bệnh Nhân Theo Độ Tuổi
            const ageGroupColors = generateColors(patientsByAgeGroup.length);
            new Chart(document.getElementById('ageGroupChart'), {
                type: 'doughnut',
                data: {
                    labels: patientsByAgeGroup.map(row => row[0]),
                    datasets: [{
                            label: 'Số lượng bệnh nhân',
                            data: patientsByAgeGroup.map(row => row[1]),
                            backgroundColor: ageGroupColors,
                            hoverOffset: 4
                        }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: false,
                            text: 'Bệnh Nhân Theo Độ Tuổi'
                        }
                    }
                }
            });

            // 4. Biểu đồ Bệnh Nhân Theo Chuyên Khoa
            const specialtyColors = generateColors(patientsBySpecialty.length);
            new Chart(document.getElementById('specialtyChart'), {
                type: 'line',
                data: {
                    labels: patientsBySpecialty.map(row => row[0]),
                    datasets: [{
                            label: 'Số lượng cuộc hẹn',
                            data: patientsBySpecialty.map(row => row[1]),
                            backgroundColor: 'rgba(255, 193, 7, 0.7)', // Màu vàng warning
                            borderColor: 'rgba(255, 193, 7, 1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                        },
                        title: {
                            display: false,
                            text: 'Bệnh Nhân Theo Chuyên Khoa'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Số lượng cuộc hẹn'
                            }
                        }
                    }
                }
            });

            // 5. Biểu đồ Dịch Vụ & Thuốc Phổ Biến
            const servicesColors = generateColors(servicesUsed.length);
            new Chart(document.getElementById('servicesUsedChart'), {
                type: 'bar',
                data: {
                    labels: servicesUsed.map(row => row[0]),
                    datasets: [{
                            label: 'Số lượng sử dụng',
                            data: servicesUsed.map(row => row[1]),
                            backgroundColor: servicesColors,
                            borderColor: servicesColors.map(c => c.replace('0.7', '1')), // Màu đậm hơn cho border
                            borderWidth: 1
                        }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false,
                        },
                        title: {
                            display: false,
                            text: 'Dịch Vụ Phổ Biến'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Số lượng'
                            }
                        }
                    }
                }
            });

            // 6. Biểu đồ Bệnh Phổ Biến
            const diseaseColors = generateColors(popularDiseases.length);
            new Chart(document.getElementById('popularDiseasesChart'), {
                type: 'polarArea',
                data: {
                    labels: popularDiseases.map(row => row[0]),
                    datasets: [{
                            label: 'Số lượng trường hợp',
                            data: popularDiseases.map(row => row[1]),
                            backgroundColor: diseaseColors,
                        }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: false,
                            text: 'Bệnh Phổ Biến'
                        }
                    }
                }
            });
        };
        /*]]>*/
    </script>
</th:block>
</body>
</html>
